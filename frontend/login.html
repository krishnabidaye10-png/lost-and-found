
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>Lost & Found</h1>

        <p>Welcome back</p>

    </header>


    <main>

        <form id="loginForm" class="auth-form">

            <h2>Login</h2>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                Login
            </button>


            <p
                id="loginMessage"
                class="auth-message"
            ></p>


            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Register
                </a>

            </p>

        </form>

    </main>


    <footer>

        <p>Lost & Found Community</p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
