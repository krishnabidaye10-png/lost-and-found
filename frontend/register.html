
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - Lost & Found</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>

        <h1>Lost & Found</h1>

        <p>Create your account</p>

    </header>


    <main>

        <form id="registerForm" class="auth-form">

            <h2>Register</h2>


            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                    minlength="6"
                >

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    required
                    minlength="6"
                >

            </div>


            <button
                type="submit"
                class="button"
            >
                Create Account
            </button>


            <p
                id="registerMessage"
                class="auth-message"
            ></p>


            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </form>

    </main>


    <footer>

        <p>Lost & Found Community</p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
